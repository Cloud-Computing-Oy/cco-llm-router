# Audits pull requests with Cloud-Computing-Oy/repo-auditor. Posts findings
# as a GitHub Check Run on the PR head SHA, scoped to files changed vs the
# base branch.
#
# Required secret: REPO_AUDITOR_TOKEN
#   Fine-grained PAT with read-only access to Cloud-Computing-Oy/repo-auditor
#   (Contents: Read). The default GITHUB_TOKEN does not cross repo boundaries
#   even within the same org for private repos, so we need an explicit token
#   to fetch the auditor's source. The same PAT is forwarded to the auditor
#   itself so it can read PR metadata.
#
# Deterministic-only mode (--no-agents) — no LLM API keys required. To
# enable LLM agent verification, add OPENAI_API_KEY / GROQ_API_KEY etc.
# as repo secrets and drop --no-agents from the run command.

name: repo-audit

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: read
      actions: read           # codeql-action reads workflow-run metadata
      security-events: write  # codeql-action uploads SARIF to Code Scanning

    # Route every github.* expression through env: so user-controlled values
    # (branch names from fork PRs) cannot escape bash quoting and inject
    # commands. See:
    # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
    env:
      REPO_FULL: ${{ github.repository }}
      HEAD_REF: ${{ github.head_ref }}
      BASE_REF: ${{ github.base_ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Clone the auditor as a sibling directory rather than `npm install -g
      # github:...` — the latter resolves to an ssh:// URL which the runner
      # has no key for, and `npm install -g git+https://...` would still need
      # a cross-repo token. actions/checkout with an explicit token is the
      # cleanest path; the same token is reused by the auditor at run time.
      - name: Checkout repo-auditor
        uses: actions/checkout@v4
        with:
          repository: Cloud-Computing-Oy/repo-auditor
          path: .repo-auditor
          token: ${{ secrets.REPO_AUDITOR_TOKEN }}

      - name: Install repo-auditor deps
        working-directory: .repo-auditor
        run: npm ci --ignore-scripts

      - name: Run audit (PR scope)
        working-directory: .repo-auditor
        env:
          GH_TOKEN: ${{ secrets.REPO_AUDITOR_TOKEN }}
        # Run via tsx directly rather than the built bin — repo-auditor's
        # `npm run build` currently fails (src imports from scripts/ which
        # is outside rootDir) and bin packaging is moot for CI anyway. tsx
        # transpiles on-demand and doesn't enforce rootDir.
        run: |
          node --import tsx src/index.ts run "https://github.com/${REPO_FULL}" \
            --branch "${HEAD_REF}" \
            --base "origin/${BASE_REF}" \
            --no-agents \
            --sarif \
            --output ../reports

      - name: Find report dir
        id: report
        run: |
          # Report layout: reports/<owner>/<timestamp>/. Use find -type d
          # so we don't accidentally pick up summary.md or findings.json.
          report_dir=$(find reports -mindepth 2 -maxdepth 2 -type d 2>/dev/null | sort -r | head -1)
          echo "dir=$report_dir" >> "$GITHUB_OUTPUT"

      - name: Publish check-run
        working-directory: .repo-auditor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # writing checks on THIS repo — default token is enough
          REPORT_DIR: ${{ steps.report.outputs.dir }}
        run: |
          node --import tsx src/index.ts check-run "../${REPORT_DIR}" \
            --repo "${REPO_FULL}" \
            --head-sha "${HEAD_SHA}" \
            --pr "${PR_NUMBER}"

      # GitHub Advanced Security isn't enabled on Cloud-Computing-Oy
      # private repos — see memory `github-advanced-security-disabled`.
      # Keep non-blocking so the check-run still publishes if SARIF upload
      # is rejected.
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.report.outputs.dir != ''
        continue-on-error: true
        with:
          sarif_file: ${{ steps.report.outputs.dir }}/findings.sarif.json
          category: repo-audit
