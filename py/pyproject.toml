[project]
name = "cco-llm-router"
version = "0.2.1"
description = "Python sibling of @cloud-computing-oy/llm-router — provider-fallback chains over Anthropic / Google / OpenAI / Groq / OpenRouter / Ollama / DeepInfra / Together with per-provider monthly budget enforcement and a Cohere rerank helper. Reads API keys from /etc/cco/keys.env at runtime."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "Cloud-Computing-Oy" },
]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.50"]
google = ["google-genai>=1.0"]
openai = ["openai>=1.40"]
all = ["anthropic>=0.50", "google-genai>=1.0", "openai>=1.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
cco-llm-usage = "cco_llm_router.cli:main"

[project.urls]
Repository = "https://github.com/Cloud-Computing-Oy/cco-llm-router"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cco_llm_router"]
