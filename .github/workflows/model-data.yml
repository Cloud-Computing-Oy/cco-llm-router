name: model-data
on:
  schedule:
    - cron: "17 2 * * *"   # nightly, off-peak minute
  workflow_dispatch:
  push:
    # Spec §5 also names catalog.ts; the builder never reads it, so triggering on it would change nothing.
    paths: ["data/pricing.json", "scripts/check-provider-models.ts", "scripts/build-model-data*.ts"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Check provider models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: npm run check:models
      - name: Build dataset
        run: npm run build:model-data
      - name: Validate schema
        run: node --import tsx scripts/validate-model-data.ts
      - name: Commit regenerated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/model-data.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "data: refresh model-data bundle"; git push; fi
      - name: Publish release asset
        run: |
          gh release create model-data data/model-data.json --title "model-data $(date -u +%F)" --notes "Auto-generated model availability + pricing dataset" --prerelease || true
          gh release upload model-data data/model-data.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Self-check asset URL
        run: |
          # -L follows the redirect to object storage; without it curl saves the
          # empty 302 body and the check fails on valid assets. The retry covers
          # the window where the download URL still serves nothing after upload.
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "https://github.com/${{ github.repository }}/releases/download/model-data/model-data.json" -o /tmp/asset.json \
               && node -e "const d = require('/tmp/asset.json'); if (!Array.isArray(d.models)) process.exit(1); console.log('asset fetch OK')"; then
              exit 0
            fi
            echo "attempt $attempt failed; retrying in 5s"
            sleep 5
          done
          echo "asset self-check failed after 5 attempts"
          exit 1
