[project]
name = "cco-llm-router"
version = "0.8.0"
description = "Provider-neutral LLM fallback chains with local budget estimates."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Cloud-Computing-Oy" },
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.50"]
google = ["google-genai>=1.0"]
openai = ["openai>=1.40"]
all = ["anthropic>=0.50", "google-genai>=1.0", "openai>=1.40"]
dev = ["build>=1.2", "pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
cco-llm-usage = "cco_llm_router.cli:main"

[project.urls]
Repository = "https://github.com/Cloud-Computing-Oy/cco-llm-router"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cco_llm_router"]
