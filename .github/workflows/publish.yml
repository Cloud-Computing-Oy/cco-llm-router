# Publish to GitHub Packages on tag push (v*).
#
# Trigger: push a tag like v0.1.3. The workflow extracts the version
# from the tag, ensures package.json matches, and publishes to
# https://npm.pkg.github.com under the @cloud-computing-oy scope.
#
# Consumers install with .npmrc:
#   @cloud-computing-oy:registry=https://npm.pkg.github.com
#   //npm.pkg.github.com/:_authToken=${NPM_TOKEN}

name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: [self-hosted, hetzner-dev]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@cloud-computing-oy'

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package.json $pkg" >&2
            exit 1
          fi

      - run: npm install --ignore-scripts

      # Default GITHUB_TOKEN returns 401 for @cloud-computing-oy org-scoped
      # packages (verified on the 0.7.0 push attempt). Use a PAT with
      # write:packages instead — same token the user uses manually via
      # `NPM_TOKEN=$(gh auth token) npm publish`.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CCO_PUBLISH_TOKEN }}
