name: python-release
on:
  push:
    tags: ["py-v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - run: python -m pip install build
      - name: Verify tag matches py/pyproject.toml
        # The tag is passed through env, never interpolated into the script:
        # a tag name may contain shell metacharacters (run-shell-injection).
        env:
          TAG: ${{ github.ref_name }}
        run: node --import tsx scripts/check-py-tag.ts "$TAG"
      - run: python -m build py --outdir dist-py
      - name: Publish wheel + sdist as release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist-py/* \
            --title "Python cco-llm-router $TAG" \
            --notes "Python sibling wheel + sdist for $TAG." \
            || gh release upload "$TAG" dist-py/* --clobber
